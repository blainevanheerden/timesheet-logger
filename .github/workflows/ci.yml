name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SERVER_API_KEY: dev-key
      # PR: Adding this comment so the PR has a small meaningful change
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Smoke test dist
        run: bash ./scripts/smoke-test.sh dist
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          SERVER_API_KEY: dev-key
        run: npx playwright test --reporter=list

  android-debug-apk:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      VITE_API_URL: http://localhost:4000
      VITE_SERVER_API_KEY: dev-key
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: VITE_API_URL=${{ env.VITE_API_URL }} VITE_SERVER_API_KEY=${{ env.VITE_SERVER_API_KEY }} npm run build
      - name: Set up Android SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: timesheet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
